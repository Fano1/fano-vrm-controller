<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Fano VRM Controller — Mixamo Example</title>

		<style>
			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #111;
				font-family:
					Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
					sans-serif;
			}

			#canvas {
				width: 100vw;
				height: 100vh;
				display: block;
			}

			#panel {
				position: fixed;
				top: 16px;
				left: 16px;
				z-index: 10;
				width: 340px;
				max-height: calc(100vh - 32px);
				overflow-y: auto;
				padding: 14px;
				border: 1px solid rgba(255, 255, 255, 0.12);
				border-radius: 14px;
				background: rgba(0, 0, 0, 0.7);
				color: white;
				backdrop-filter: blur(12px);
			}

			#panel h1 {
				margin: 0 0 4px;
				font-size: 16px;
			}

			#status {
				margin: 0;
				color: rgba(255, 255, 255, 0.7);
				font-size: 13px;
				line-height: 1.5;
			}

			#error {
				margin-top: 10px;
				color: #ff6b6b;
				font-size: 13px;
				white-space: pre-wrap;
			}

			.section {
				margin-top: 14px;
				border-top: 1px solid rgba(255, 255, 255, 0.12);
				padding-top: 12px;
			}

			.section > h2 {
				margin: 0 0 8px;
				font-size: 12px;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: rgba(255, 255, 255, 0.55);
			}

			.row {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
			}

			button {
				flex: 1 1 auto;
				border: 0;
				border-radius: 10px;
				padding: 8px 10px;
				background: white;
				color: black;
				font-weight: 700;
				font-size: 12px;
				cursor: pointer;
			}

			button:hover {
				background: #e8e8e8;
			}

			button.ghost {
				background: rgba(255, 255, 255, 0.12);
				color: white;
			}

			button.ghost:hover {
				background: rgba(255, 255, 255, 0.22);
			}

			button:disabled {
				opacity: 0.4;
				cursor: default;
			}

			.anim-row {
				display: flex;
				gap: 6px;
				margin-bottom: 8px;
			}

			.anim-row input[type="text"] {
				flex: 1 1 auto;
				min-width: 0;
				padding: 8px 10px;
				border-radius: 10px;
				border: 1px solid rgba(255, 255, 255, 0.2);
				background: rgba(255, 255, 255, 0.08);
				color: white;
				font-size: 12px;
			}

			.anim-row button {
				flex: 0 0 auto;
			}

			#anim-status {
				margin: 8px 0 0;
				font-size: 12px;
				color: rgba(255, 255, 255, 0.6);
			}

			#playlist {
				margin-top: 8px;
			}
		</style>

		<!--
      Bare specifiers ("three", "@pixiv/three-vrm") need an import map. Paths are
      relative to THIS file (two folders deep in docs/), so we climb to the repo
      root with ../../. Serve the repo root (`bunx serve .`) and open
      /docs/mixamo-example/mixamo-example.html.
    -->
		<script type="importmap">
			{
				"imports": {
					"three": "../../node_modules/three/build/three.module.js",
					"three/addons/": "../../node_modules/three/examples/jsm/",
					"@pixiv/three-vrm": "../../node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
				}
			}
		</script>
	</head>

	<body>
		<canvas id="canvas"></canvas>

		<div id="panel">
			<h1>Mixamo Animation</h1>
			<p id="status">Waiting...</p>

			<div class="section">
				<h2>Load &amp; play</h2>
				<p style="margin: 0 0 8px; font-size: 12px; color: rgba(255, 255, 255, 0.6);">
					Path to a Mixamo <code>.fbx</code> download, relative to this file.
				</p>
				<div class="anim-row">
					<input type="text" id="anim-url" value="../../animation/RumbaDancing.fbx" />
					<button id="play-anim">Play</button>
				</div>
				<div class="row">
					<button id="stop-anim" class="ghost">Stop</button>
				</div>
				<p id="anim-status"></p>

				<div id="playlist" class="row">
					<!-- Filled in with one-click preset buttons, one per ANIMATION_PRESETS entry. -->
				</div>
			</div>

			<div id="error"></div>
		</div>

		<script type="module">
			import * as THREE from "three";
			import { OrbitControls } from "three/addons/controls/OrbitControls.js";

			// IMPORTANT: run `bun run build` first — this imports the built package.
			import { loadVRM, loadMixamoAnimation } from "../../dist/index.js";

			const MODEL_URL = "../../avatar.vrm";
			// One-click presets — edit to match whatever .fbx files you've downloaded.
			// Paths may contain spaces (Mixamo's default download names); they're
			// encodeURI()'d in playAnimation() below before being fetched.
			const ANIMATION_PRESETS = [
				"../../animation/RumbaDancing.fbx",
				"../../animation/Snake Hip Hop Dance.fbx",
				"../../animation/Booty Hip Hop Dance.fbx",
				"../../animation/Macarena Dance.fbx",
			];

			const canvas = document.querySelector("#canvas");
			const statusEl = document.querySelector("#status");
			const errorEl = document.querySelector("#error");
			const animUrlEl = document.querySelector("#anim-url");
			const animStatusEl = document.querySelector("#anim-status");
			const playBtn = document.querySelector("#play-anim");
			const stopBtn = document.querySelector("#stop-anim");
			const playlistEl = document.querySelector("#playlist");

			let avatar = null;
			let mixer = null;
			/** @type {import("three").AnimationAction | null} */
			let currentAction = null;

			const setStatus = (m) => (statusEl.textContent = m);
			const setAnimStatus = (m) => (animStatusEl.textContent = m);
			const setError = (e) =>
				(errorEl.textContent = e ? String(e?.stack ?? e) : "");

			// ---- Three.js boilerplate ------------------------------------------------

			const scene = new THREE.Scene();
			scene.background = new THREE.Color(0x111111);

			const camera = new THREE.PerspectiveCamera(
				35,
				window.innerWidth / window.innerHeight,
				0.1,
				100,
			);
			camera.position.set(0, 1.35, 2.6);

			const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

			const controls = new OrbitControls(camera, renderer.domElement);
			controls.target.set(0, 1.2, 0);
			controls.enableDamping = true;

			scene.add(new THREE.AmbientLight(0xffffff, 1.4));
			const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
			dirLight.position.set(1, 2, 3);
			scene.add(dirLight);
			scene.add(new THREE.GridHelper(10, 10));

			// ---- Animation loading -----------------------------------------------------

			// Plays `url`, crossfading from whatever was already playing. This is
			// plain three.js `AnimationMixer`/`AnimationAction` — the package hands
			// back a retargeted clip and stops there, so nothing here is special.
			async function playAnimation(url) {
				if (!avatar) return;

				try {
					setError("");
					setAnimStatus(`Loading ${url}...`);
					playBtn.disabled = true;

					const clip = await loadMixamoAnimation(encodeURI(url), avatar.vrm);
					const nextAction = mixer.clipAction(clip);
					nextAction.reset().play();

					if (currentAction && currentAction !== nextAction) {
						currentAction.crossFadeTo(nextAction, 0.3, false);
					}

					currentAction = nextAction;
					setAnimStatus(`Playing ${url}`);
				} catch (error) {
					console.error(error);
					setAnimStatus(`Failed to load ${url}.`);
					setError(error);
				} finally {
					playBtn.disabled = false;
				}
			}

			playBtn.addEventListener("click", () => playAnimation(animUrlEl.value));

			stopBtn.addEventListener("click", () => {
				currentAction?.stop();
				currentAction = null;
				setAnimStatus("Stopped.");
			});

			for (const url of ANIMATION_PRESETS) {
				const b = document.createElement("button");
				b.textContent = url.split("/").pop();
				b.className = "ghost";
				b.addEventListener("click", () => {
					animUrlEl.value = url;
					playAnimation(url);
				});
				playlistEl.appendChild(b);
			}

			// ---- Load ------------------------------------------------------------------

			async function loadAvatar() {
				try {
					setError("");
					setStatus("Loading VRM...");

					avatar = await loadVRM(MODEL_URL, {
						scene,
						onProgress(p) {
							const pct = Math.round(p.progress * 100);
							setStatus(
								p.total > 0
									? `Loading VRM... ${pct}%`
									: `Loading VRM... ${p.loaded} bytes`,
							);
						},
					});

					avatar.scene.rotation.y = Math.PI; // face the camera

					mixer = new THREE.AnimationMixer(avatar.vrm.scene);
					// The seam: the mixer runs BEFORE vrm.update, which then copies the
					// animated normalized-bone pose onto the model's real bones.
					avatar.registerUpdate((delta) => mixer.update(delta));

					setStatus("Loaded. Pick a Mixamo .fbx animation to play.");
				} catch (error) {
					console.error(error);
					setStatus("Failed to load VRM.");
					setError(error);
				}
			}

			// ---- Render loop -------------------------------------------------------------

			const clock = new THREE.Clock();

			function animate() {
				requestAnimationFrame(animate);
				const delta = clock.getDelta();

				controls.update();
				// Runs registered updaters (mixer.update) then vrm.update, which
				// flushes the retargeted pose, spring bones, and look-at.
				avatar?.update(delta);

				renderer.render(scene, camera);
			}

			window.addEventListener("resize", () => {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize(window.innerWidth, window.innerHeight);
			});

			loadAvatar();
			animate();
		</script>
	</body>
</html>
